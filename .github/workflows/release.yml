name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          [[ "$RELEASE_TAG" != */* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test and packaging dependencies
        run: python -m pip install --upgrade pytest pyyaml pypdf fitdecode==0.11.0 numpy==1.26.4

      - name: Run unit tests
        run: python -m pytest tests/ -x -q --tb=short

      - name: Build QGIS-major plugin ZIPs
        run: |
          python scripts/package_plugin.py --qgis-major 3
          python scripts/package_plugin.py --qgis-major 4
          python scripts/package_plugin.py

      - name: Generate ZIP checksums
        run: |
          cd dist
          sha256sum qfit-*.zip > "qfit-${RELEASE_TAG#v}-SHA256SUMS.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName --jq .tagName; then
            echo "Release already exists; preserving its status, notes and assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/qfit-*.zip \
            dist/*-SHA256SUMS.txt \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes
